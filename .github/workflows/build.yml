name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, package
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Build (Release)
        run: |
          xcodebuild \
            -project TinyTodo.xcodeproj \
            -scheme TinyTodo \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit and integration tests
        run: |
          xcodebuild \
            -project TinyTodo.xcodeproj \
            -scheme TinyTodo \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test | tee build-tests.log

      - name: Package DMG
        run: bash scripts/make_dmg.sh

      - name: Upload ad-hoc dev DMG
        uses: actions/upload-artifact@v4
        with:
          name: TinyTodo-dev-dmg
          path: build/*.dmg
          if-no-files-found: error

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: build-tests.log

  ui-test-build:
    # macOS UI tests need a logged-in GUI session with Accessibility authorization.
    # CI compiles the XCUITest bundle; execution runs locally via `xcodebuild -scheme TinyTodoUITests test`,
    # where TestScreenPolicy keeps the automation window on a non-main display.
    name: UI tests (compile)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build XCUITest bundle
        run: |
          xcodebuild \
            -project TinyTodo.xcodeproj \
            -scheme TinyTodoUITests \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
